<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font: 13px system-ui, sans-serif; margin: 12px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    select, input[type=number], textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 70px; font: 11px monospace; }
    .check { font-weight: 400; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 6px; }
    #status { margin-top: 8px; font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <label for="mode">Mode</label>
  <select id="mode">
    <option value="log">1. Log: just record clicks</option>
    <option value="pick">2. Pick: click Buy/Sell to guard it</option>
    <option value="hold">3. Hold: show the popup</option>
  </select>

  <label for="wait">Wait (seconds)</label>
  <input id="wait" type="number" min="0" max="60">

  <label class="check"><input id="textMatch" type="checkbox"> Also guard any button starting with Buy/Sell</label>

  <label for="selectors">Guarded controls</label>
  <textarea id="selectors" spellcheck="false"></textarea>

  <div class="row">
    <button id="save">Save</button>
    <button id="copy">Copy log</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
