# DisciplineGuard for Windows (SPEC §9.5).
# Every change: the app's tests against the real server handler, clippy, a debug build, and the EA compiled with
# MetaEditor in a fresh portable MetaTrader 5 (so nobody compiles it by hand).
# Run by hand with "release" ticked: signs the EA manifest, builds the signed installer and publishes it with the
# signed update manifest to github.com/wwwlqh/disciplineguard/releases, where disciplineguard.leowqiheng.workers.dev/downloads
# points (web/public/_redirects). Secrets are listed in clients/windows/README.md.
name: Windows app
on:
  push:
    branches: [main, 'main-*']
    paths: ['clients/windows/**', 'clients/mt5/**', 'server/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['clients/windows/**', 'clients/mt5/**', 'server/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Build, sign and publish a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test --workspace clients/windows
      - run: npm run typecheck --workspace clients/windows
      - name: Build the app (debug; without the signed EA it can't Protect)
        working-directory: clients/windows
        run: cargo build -p disciplineguard

  ea:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile the EA
        shell: pwsh
        run: clients/mt5/compile.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: DisciplineGuard-ea
          path: clients/mt5/DisciplineGuard.ex5
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    permissions:
      contents: write
    needs: [test, ea]
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v7
        with: { name: DisciplineGuard-ea, path: ea-build }
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path clients/windows/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Sign the EA manifest
        env:
          DG_RELEASE_KEY: ${{ secrets.DG_RELEASE_KEY }}
        run: node scripts/sign-ea-manifest.ts ea-build/DisciplineGuard.ex5 ${{ steps.v.outputs.version }}
      # Code signing is optional: without the Azure secrets the installer is unsigned and SmartScreen warns once.
      - if: ${{ env.HAS_SIGNING == 'true' }}
        run: cargo install trusted-signing-cli --locked
      - name: Build and code-sign
        working-directory: clients/windows/app
        shell: pwsh
        env:
          DG_RELEASE_PUB: ${{ secrets.DG_RELEASE_PUB }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $conf = @{ plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBKEY } } }
          if ($env:SIGN_ENDPOINT) { $conf.bundle = @{ windows = @{ signCommand = "trusted-signing-cli -e $env:SIGN_ENDPOINT -a $env:SIGN_ACCOUNT -c $env:SIGN_PROFILE -d DisciplineGuard %1" } } }
          $confPath = Join-Path $PWD "release.conf.json"
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM $confPath
          npx --yes @tauri-apps/cli@2 build --config $confPath
      - name: Build the TradingView extension
        shell: pwsh
        run: |
          npm ci
          npm run build -w clients/extension
          Compress-Archive -Path clients/extension/dist/* -DestinationPath DisciplineGuard-TradingView.zip
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "clients/windows/target/release/bundle/nsis"
          Copy-Item "$dir/DisciplineGuard_${v}_x64-setup.exe" DisciplineGuard-Setup.exe
          $sig = Get-Content "$dir/DisciplineGuard_${v}_x64-setup.exe.sig" -Raw
          @{
            version = $v
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/wwwlqh/disciplineguard/releases/download/v$v/DisciplineGuard-Setup.exe" } }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json
          gh release create "v$v" DisciplineGuard-Setup.exe latest.json DisciplineGuard-TradingView.zip --repo wwwlqh/disciplineguard --title "DisciplineGuard $v" --notes "Built from the source in this repository."
