[package]
name = "disciplineguard"
description = "DisciplineGuard for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dg-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = { version = "2.13.0", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1.53.1", features = ["time"] }

[build-dependencies]
tauri-build = "2.7.0"
