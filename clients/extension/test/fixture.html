<!doctype html>
<!-- A stand-in for a TradingView chart with an order panel and the Account Manager, using the controls in src/tv.ts. -->
<html class="theme-light">
<head><meta charset="utf-8"><title>Fixture chart</title></head>
<body>
  <div id="header-toolbar-symbol-search">EURUSD</div>
  <div data-name="order-panel">
    <div data-name="order-type-tabs"><span aria-selected="true">Market</span></div>
    <button data-name="side-control-buy" aria-pressed="true">Buy</button>
    <button data-name="side-control-sell" aria-pressed="false">Sell</button>
    <div data-name="units-input"><input value="1000"></div>
    <div data-name="stop-loss-price-input"><input value=""></div>
    <button data-name="place-and-modify-button" id="submit">Buy 1000 EURUSD MKT</button>
  </div>
  <button id="close">Close position</button>
  <div data-name="account-manager">
    <span data-name="broker-name">Paper Trading</span>
    <span data-name="account-id">PT12345678</span>
    <span data-name="account-currency">USD</span>
    <table data-name="positions-table"><tbody></tbody></table>
  </div>
  <script>
    // The page's own handler: counts orders that reached it.
    window.sent = 0;
    document.getElementById('submit').addEventListener('click', () => { window.sent++; });
  </script>
</body>
</html>
